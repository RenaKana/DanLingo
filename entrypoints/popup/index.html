<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>DanLingo</title>
  </head>
  <body class="popup-page">
    <main class="popup popup-shell" aria-labelledby="popup-title">
      <header class="popup-header">
        <div class="brand">
          <img class="mark" src="/icon/48.png" width="28" height="28" alt="">
          <h1 id="popup-title">DanLingo</h1>
        </div>
        <span id="scenario" class="badge" data-i18n="m_0e541bff221e">视频与直播</span>
      </header>

      <section class="status-panel" aria-label="当前翻译状态" data-i18n-aria-label="m_6477a1221b94">
        <div class="status-heading">
          <span class="status-led" aria-hidden="true"></span>
          <p id="status" class="status" role="status" aria-live="polite" data-i18n="m_4ad4d63474ae">正在读取状态…</p>
        </div>
        <p id="metrics" class="metrics"></p>
        <p id="coverage" class="coverage" hidden></p>
      </section>

      <section class="popup-controls" aria-label="快速设置" data-i18n-aria-label="m_be2cc505b162">
        <div class="popup-toolbar" data-theme-control>
          <label class="toggle-row check" for="enabled">
            <input id="enabled" type="checkbox">
            <span class="toggle-copy">
              <strong data-i18n="m_a62128615126">启用翻译</strong>
            </span>
          </label>
          <div class="popup-actions">
            <button id="theme" class="theme-cycle" type="button" data-theme-preference="system" aria-label="外观" aria-describedby="theme-status">
              <svg class="theme-icon theme-icon-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
              <svg class="theme-icon theme-icon-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.3 15.2A8.8 8.8 0 0 1 8.8 3.7a9 9 0 1 0 11.5 11.5Z"/></svg>
              <svg class="theme-icon theme-icon-system" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></svg>
            </button>
            <button id="settings" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 3-.7 2.4-2 .9-2.3-.6L2 10l1.8 1.8v2.4L2 16l2.5 4.3 2.3-.6 2 .9.7 2.4h5l.7-2.4 2-.9 2.3.6L22 16l-1.8-1.8v-2.4L22 10l-2.5-4.3-2.3.6-2-.9-.7-2.4Z" transform="translate(1.2 .3) scale(.9)"/><circle cx="12" cy="12" r="3"/></svg><span data-i18n="m_df3d58c7d84b">设置</span></button>
          </div>
          <span id="theme-status" class="theme-status" data-theme-status role="status" aria-live="polite" hidden></span>
        </div>

        <div class="popup-field-grid">
          <label for="language"><span data-i18n="m_966a23e84aed">目标语言</span>
            <select id="language" required></select>
          </label>
          <label for="mode"><span data-i18n="m_8d3d73a18aff">
            显示方式
            </span><select id="mode">
              <option value="translated" data-i18n="m_413d0de8b6d6">译文优先</option>
              <option value="original" data-i18n="m_354b28c85333">原文</option>
            </select>
          </label>
        </div>
      </section>

      <footer class="popup-footer">
        <p id="online-budget-status" class="subtle" role="status" aria-live="polite" data-i18n="m_00c1d49d7e67">正在读取在线请求计数…</p>
      </footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
