<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>DanLingo</title>
  </head>
  <body class="popup-page">
    <main class="popup popup-shell" aria-labelledby="popup-title">
      <header class="popup-header">
        <div class="brand">
          <span class="mark" aria-hidden="true">译</span>
          <h1 id="popup-title">DanLingo</h1>
        </div>
        <span id="scenario" class="badge">视频与直播</span>
      </header>

      <section class="status-panel" aria-label="当前翻译状态">
        <div class="status-heading">
          <span class="status-led" aria-hidden="true"></span>
          <p id="status" class="status" role="status" aria-live="polite">正在读取状态…</p>
        </div>
        <p id="metrics" class="metrics"></p>
        <p id="coverage" class="coverage" hidden></p>
      </section>

      <section class="popup-controls" aria-label="快速设置">
        <label class="toggle-row check" for="enabled">
          <input id="enabled" type="checkbox">
          <span class="toggle-copy">
            <strong>启用弹幕翻译</strong>
            <small>支持的视频/直播页面</small>
          </span>
        </label>

        <div class="popup-field-grid">
          <label for="language">
            目标语言
            <select id="language">
              <option value="zh-Hans">简体中文</option>
              <option value="zh-Hant">繁体中文</option>
              <option value="en">英语</option>
              <option value="ja">日语</option>
              <option value="ko">韩语</option>
            </select>
          </label>
          <label for="mode">
            显示方式
            <select id="mode">
              <option value="translated">译文优先</option>
              <option value="original">原文</option>
            </select>
          </label>
        </div>
      </section>

      <footer class="popup-footer">
        <p id="online-budget-status" class="subtle" role="status" aria-live="polite">正在读取在线请求计数…</p>
        <div class="popup-footer-actions">
          <p class="subtle">超时保留原文</p>
          <button id="settings" type="button">服务与设置</button>
        </div>

        <label class="theme-control" data-theme-control for="theme">
          <span>外观</span>
          <select id="theme" aria-label="外观">
            <option value="system">跟随系统</option>
            <option value="light">浅色</option>
            <option value="dark">深色</option>
          </select>
          <span id="theme-status" class="theme-status" data-theme-status role="status" aria-live="polite" hidden></span>
        </label>

      </footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
