<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DanLingo · 派发验收</title>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">DanLingo · 本地验收</p>
        <h1>派发控制台</h1>
      </div>
      <span id="connection-state" class="state" data-state="offline">未连接</span>
    </header>
    <section aria-label="本地连接">
      <dl>
        <div><dt>扩展版本</dt><dd id="version">—</dd></div>
        <div><dt>构建身份</dt><dd id="build-id">—</dd></div>
        <div><dt>目标页面</dt><dd id="target-state">未打开</dd></div>
        <div><dt>最近操作</dt><dd id="last-command">—</dd></div>
      </dl>
      <div class="actions">
        <button id="connect" type="button">连接</button>
        <button id="disconnect" type="button" disabled>断开</button>
      </div>
      <p id="status" role="status" aria-live="polite">等待本地 runner 连接参数。</p>
    </section>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
